<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Subtitlr — captions spike</title>
    <style>body{background:#111;color:#ddd;font-family:sans-serif} canvas{max-height:70vh}</style>
  </head>
  <body>
    <p id="status">loading…</p>
    <canvas id="c"></canvas>
    <script type="module">
      import { groupWords, renderers, drawCaptions, ensureFontsLoaded } from '/src/captions.ts';
      import { DEFAULT_SETTINGS } from '/src/types.ts';

      const text = 'this whole thing runs entirely in your browser. no upload, no server, no subscription. drop a video, hit export, done.';
      // realistic-ish timings: ~0.28 s per word + a bit per letter, pauses after sentence ends
      const words = [];
      let t = 0.4;
      for (const raw of text.split(/\s+/)) {
        const dur = 0.16 + raw.replace(/[^a-z]/gi, '').length * 0.045;
        words.push({ text: raw, start: +t.toFixed(3), end: +(t + dur).toFixed(3) });
        t += dur + 0.07;
        if (/[.!?]$/.test(raw)) t += 0.45;
        if (/,$/.test(raw)) t += 0.15;
      }
      window.sampleWords = words;

      const settings = { ...DEFAULT_SETTINGS };
      const status = document.getElementById('status');
      const canvas = document.getElementById('c');

      window.groupSample = (override = {}) => JSON.stringify(groupWords(words, { ...settings, ...override }));

      window.renderFrame = (styleId, timeSec, w = 1080, h = 1920, override = {}) => {
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, '#2b3a55'); g.addColorStop(0.55, '#1a1f2e'); g.addColorStop(1, '#0b0c12');
        ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
        // some "video content" so we see how captions sit on busy pixels
        ctx.fillStyle = 'rgba(255,160,90,0.35)'; ctx.beginPath(); ctx.arc(w * 0.7, h * 0.35, w * 0.25, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(120,200,255,0.25)'; ctx.fillRect(w * 0.1, h * 0.6, w * 0.5, h * 0.3);
        const s = { ...settings, ...override, style: styleId };
        const lines = groupWords(words, s);
        if (renderers[styleId]) drawCaptions(ctx, timeSec, w, h, lines, s);
        return canvas.toDataURL('image/png');
      };

      await ensureFontsLoaded(['Inter', 'Montserrat', 'Bebas Neue', 'Poppins']);
      window.fontsReady = true;
      status.textContent = 'ready';
      window.renderFrame('pop', 1.2);
    </script>
  </body>
</html>
