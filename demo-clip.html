<!doctype html>
<!-- Dev-only page: builds a vertical demo clip (canvas visuals + public-domain speech) with MediaRecorder. -->
<html><body>
<script type="module">
  // Renders ~11 s of 1080x1920 visuals while playing the JFK clip into the recorder's audio track.
  window.makeDemoClip = async (audioUrl) => {
    const audioCtx = new AudioContext();
    const buf = await audioCtx.decodeAudioData(await (await fetch(audioUrl)).arrayBuffer());
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1920;
    const ctx = canvas.getContext('2d');
    const dest = audioCtx.createMediaStreamDestination();
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.connect(dest);

    const stream = new MediaStream([...canvas.captureStream(30).getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 6_000_000 });
    const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    const done = new Promise((res) => { rec.onstop = () => res(new Blob(chunks, { type: 'video/webm' })); });

    const dur = buf.duration + 0.4;
    rec.start();
    src.start();
    const t0 = performance.now();
    await new Promise((resolve) => {
      const tick = () => {
        const t = (performance.now() - t0) / 1000;
        // slow drifting gradient + soft blobs, looks like stock b-roll
        const g = ctx.createLinearGradient(0, 0, 1080, 1920);
        g.addColorStop(0, `hsl(${220 + t * 4} 45% 18%)`);
        g.addColorStop(1, `hsl(${290 + t * 4} 40% 10%)`);
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
        for (let i = 0; i < 5; i++) {
          const x = 540 + Math.sin(t * 0.5 + i * 1.3) * 380;
          const y = 700 + Math.cos(t * 0.4 + i * 2.1) * 420;
          const r = ctx.createRadialGradient(x, y, 0, x, y, 260);
          r.addColorStop(0, `hsla(${40 + i * 60} 90% 60% / .35)`); r.addColorStop(1, 'transparent');
          ctx.fillStyle = r; ctx.beginPath(); ctx.arc(x, y, 260, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.font = '600 44px Inter, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('demo clip · public-domain speech', 540, 220);
        if (t < dur) requestAnimationFrame(tick); else resolve();
      };
      tick();
    });
    rec.stop();
    await audioCtx.close();
    const blob = await done;
    const b64 = await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
    return { size: blob.size, b64 };
  };
</script>
</body></html>
