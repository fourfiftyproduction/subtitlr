<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>transcribe spike</title>
  </head>
  <body>
    <pre id="status">idle</pre>
    <pre id="out"></pre>
    <script type="module">
      import { transcribe, transcriptionBackend } from '/src/transcribe.ts';

      const status = document.querySelector('#status');
      const out = document.querySelector('#out');

      // Fetch a clip, transcribe it, return the Transcript (+ backend, elapsed) as JSON.
      window.runTranscribe = async (url, opts = {}) => {
        const blob = await (await fetch(url)).blob();
        const t0 = performance.now();
        const transcript = await transcribe(blob, {
          ...opts,
          onProgress: (f, s) => {
            status.textContent = `${Math.round(f * 100)}% ${s}`;
            console.log('[spike]', status.textContent);
          },
        });
        const result = { ...transcript, backend: transcriptionBackend(), elapsedMs: Math.round(performance.now() - t0) };
        out.textContent = JSON.stringify(result, null, 2);
        return JSON.stringify(result);
      };
      status.textContent = 'ready';
    </script>
  </body>
</html>
